# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
  # Maintain compat entries of Julia dependencies (replaces CompatHelper).
  # The `docs` project is part of the workspace defined in Project.toml and
  # is therefore resolved together with the package.
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "daily"
